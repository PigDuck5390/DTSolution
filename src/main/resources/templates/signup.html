<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTSolution | 회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="brand-logo">
        <div class="logo-icon">
            <i class="bi bi-buildings-fill text-white fs-5"></i>
        </div>
        <h1>DTSolution</h1>
        <p>건설 디지털 트랜스포메이션 플랫폼</p>
    </div>

    <div class="card auth-card">
        <div class="card-body">
            <h5 class="card-title">회원가입</h5>
            <p class="card-subtitle">임직원 계정을 생성합니다</p>

            <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <form th:action="@{/signup}" th:object="${signupForm}" method="post">

                <div class="mb-3">
                    <label class="form-label">사번</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-badge-fill"></i>
                        </span>
                        <input type="text" th:field="*{empNo}"
                               th:classappend="${#fields.hasErrors('empNo')} ? 'is-invalid'"
                               class="form-control" placeholder="사번 입력 (5~20자)" required>
                    </div>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('empNo')}"
                         th:errors="*{empNo}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" th:field="*{password}" id="password"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               class="form-control" placeholder="영문+숫자+특수문자 8자 이상" required>
                    </div>
                    <div class="strength-bar bg-secondary" id="strengthBar" style="width:0%"></div>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">비밀번호 확인</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" th:field="*{passwordConfirm}" id="passwordConfirm"
                               class="form-control" placeholder="비밀번호를 다시 입력해주세요" required>
                    </div>
                    <div class="text-danger small mt-1" id="pwMatchMsg" style="display:none;">
                        비밀번호가 일치하지 않습니다.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">이름</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" th:field="*{name}"
                               class="form-control" placeholder="실명을 입력해주세요" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">이메일</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope-fill"></i>
                        </span>
                        <input type="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               class="form-control" placeholder="업무용 이메일" required>
                    </div>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <button type="submit" class="btn btn-primary-custom">
                    <i class="bi bi-person-plus-fill me-2"></i>계정 생성
                </button>
            </form>

            <div class="divider">이미 계정이 있으신가요?</div>
            <a th:href="@{/login}" class="btn btn-outline-secondary btn-secondary-custom">
                <i class="bi bi-box-arrow-in-right me-1"></i>로그인으로 이동
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('password').addEventListener('input', function () {
        const pw  = this.value;
        const bar = document.getElementById('strengthBar');
        let score = 0;
        if (pw.length >= 8)        score++;
        if (/[A-Z]/.test(pw))      score++;
        if (/[0-9]/.test(pw))      score++;
        if (/[@$!%*#?&]/.test(pw)) score++;
        const colors = ['#e53e3e', '#e8a020', '#38a169', '#1a4b8c'];
        const widths = ['25%', '50%', '75%', '100%'];
        bar.style.width      = pw.length === 0 ? '0' : (widths[score - 1] || '10%');
        bar.style.background = colors[score - 1] || '#e53e3e';
    });

    document.getElementById('passwordConfirm').addEventListener('input', function () {
        const pw  = document.getElementById('password').value;
        const msg = document.getElementById('pwMatchMsg');
        msg.style.display = (this.value && this.value !== pw) ? 'block' : 'none';
    });
</script>
</body>
</html>
