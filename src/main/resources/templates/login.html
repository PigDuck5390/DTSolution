<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTSolution | 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="brand-logo">
        <div class="logo-icon">
            <i class="bi bi-buildings-fill text-white fs-4"></i>
        </div>
        <h1>DTSolution</h1>
        <p>건설 디지털 트랜스포메이션 플랫폼</p>
    </div>

    <div class="card auth-card">
        <div class="card-body">
            <h5 class="card-title">로그인</h5>
            <p class="card-subtitle">사번과 비밀번호를 입력해 주세요</p>

            <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMsg}"></span>
            </div>
            <div th:if="${logoutMsg}" class="alert alert-success d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${logoutMsg}"></span>
            </div>
            <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMsg}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">사번</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-badge-fill"></i>
                        </span>
                        <input type="text" name="empNo" class="form-control"
                               placeholder="사번을 입력하세요" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">비밀번호</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" name="password" id="password"
                               class="form-control"
                               placeholder="비밀번호를 입력하세요" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                style="border-radius: 0 10px 10px 0; border-left: none;">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom">
                    <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                </button>
            </form>

            <div class="divider">계정이 없으신가요?</div>
            <a th:href="@{/signup}" class="btn btn-outline-secondary btn-secondary-custom">
                <i class="bi bi-person-plus me-1"></i>회원가입
            </a>

            <div class="security-badge">
                <i class="bi bi-shield-lock-fill"></i>
                <span>Spring Security · BCrypt · CSRF 보호 적용</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const input = document.getElementById('password');
        const icon  = document.getElementById('toggleIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });
</script>
</body>
</html>
